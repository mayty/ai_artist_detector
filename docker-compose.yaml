services:
  api-prod:
    image: ai-artist-detector-prod:latest
    build:
      context: .
      dockerfile: .docker/prod/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - "./config/local.yaml:/app/config/local.yaml:ro"
      - "./config/local.prod.overrides.yaml:/app/config/local.overrides.yaml:ro"
      - ./data:/app/data
    environment:
      CONFIG_PATH: "/app/config/local.yaml"

volumes:
  uv_cache:
